<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" font-family="Segoe UI, Arial, sans-serif">
  <!-- Source of docs/architecture_diagram.png. After editing, re-render the PNG (README section 8.4). -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6203a"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7b3fc4"/>
    </marker>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/>
    </marker>
    <g id="folder"><path d="M0,3 h6 l2,2 h8 v10 h-16 z" fill="#222"/></g>
    <g id="bucket"><path d="M0,2 h16 l-2,14 h-12 z" fill="#3a9a3a"/><ellipse cx="8" cy="2" rx="8" ry="2.5" fill="#57b857"/></g>
    <g id="lambda"><rect width="20" height="20" rx="3" fill="#f08a10"/><text x="10" y="15" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">λ</text></g>
  </defs>

  <rect width="1240" height="790" fill="#ffffff"/>
  <text x="620" y="32" font-size="19" font-weight="bold" text-anchor="middle" fill="#111">Chiang Mai Flood Recovery Data Pipeline — AWS Architecture</text>

  <!-- ============ Team laptop ============ -->
  <rect x="20" y="60" width="180" height="300" rx="10" fill="#eaf2fd" stroke="#3b7dd8" stroke-width="2"/>
  <text x="110" y="86" font-size="15" font-weight="bold" text-anchor="middle">Team Laptop</text>
  <text x="110" y="104" font-size="11" text-anchor="middle" fill="#333">AWS CLI · ingest.py</text>
  <rect x="70" y="120" width="80" height="52" rx="4" fill="#fff" stroke="#222" stroke-width="3"/>
  <path d="M60,176 h100 l-8,8 h-84 z" fill="#222"/>
  <text x="84" y="152" font-size="18" font-weight="bold" fill="#3b7dd8">&gt;_</text>
  <text x="110" y="210" font-size="12" font-weight="bold" text-anchor="middle">Upload 5 raw datasets</text>
  <g font-size="11" text-anchor="middle" fill="#333">
    <text x="110" y="230">flood_2566.csv</text>
    <text x="110" y="246">flood_2567.csv</text>
    <text x="110" y="262">chiangmai_damage.xlsx</text>
    <text x="110" y="278">household_income.xlsx</text>
    <text x="110" y="294">village_mapping.json</text>
  </g>
  <text x="110" y="320" font-size="10" text-anchor="middle" fill="#555">sources: data_catalog/sources.md</text>
  <text x="110" y="334" font-size="10" text-anchor="middle" fill="#555">md5 manifest → raw/_manifests/</text>

  <!-- laptop -> S3 -->
  <line x1="200" y1="210" x2="236" y2="210" stroke="#222" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="218" y="196" font-size="10" text-anchor="middle">Upload</text>

  <!-- ============ Operator ============ -->
  <rect x="20" y="420" width="180" height="110" rx="10" fill="#eaf2fd" stroke="#3b7dd8" stroke-width="2"/>
  <circle cx="48" cy="448" r="7" fill="none" stroke="#222" stroke-width="1.6"/>
  <path d="M36,468 q12,-16 24,0" fill="none" stroke="#222" stroke-width="1.6"/>
  <text x="120" y="450" font-size="15" font-weight="bold" text-anchor="middle">Operator</text>
  <text x="120" y="466" font-size="11" text-anchor="middle" fill="#333">Console / AWS CLI</text>
  <text x="110" y="496" font-size="12" font-weight="bold" text-anchor="middle">Start execution</text>
  <text x="110" y="512" font-size="11" text-anchor="middle" fill="#333">with a batch_id</text>
  <line x1="200" y1="475" x2="488" y2="475" stroke="#222" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="300" y="466" width="90" height="18" fill="#fff"/>
  <text x="345" y="479" font-size="11" text-anchor="middle">Manual trigger</text>

  <!-- ============ S3 bucket ============ -->
  <rect x="240" y="60" width="210" height="390" rx="10" fill="#ebf8e8" stroke="#3a9a3a" stroke-width="2"/>
  <use href="#bucket" x="256" y="72" transform="translate(0,0) scale(1)"/>
  <text x="282" y="86" font-size="15" font-weight="bold">Amazon S3</text>
  <text x="282" y="102" font-size="11" fill="#333">cs341-flood-recovery</text>
  <g font-size="13" font-weight="bold">
    <use href="#folder" x="258" y="122"/><text x="282" y="135">raw/</text>
    <use href="#folder" x="258" y="180"/><text x="282" y="193">validation/</text>
    <use href="#folder" x="258" y="232"/><text x="282" y="245">quarantine/</text>
    <use href="#folder" x="258" y="284"/><text x="282" y="297">transformation/</text>
    <use href="#folder" x="258" y="362"/><text x="282" y="375" fill="#0b7a75">curated/</text>
  </g>
  <g font-size="10.5" fill="#333">
    <text x="282" y="151">5 source datasets + _manifests/</text>
    <text x="282" y="209">cleaned/ · reports/</text>
    <text x="282" y="261">rejected batches</text>
    <text x="282" y="313">output/ — 8 CSV</text>
    <text x="282" y="327">reports/ — 6 JSON</text>
    <text x="282" y="341">_SUCCESS.json marker</text>
    <text x="282" y="391" fill="#0b7a75">Parquet: 1 dim + 3 fact tables</text>
    <text x="282" y="405" fill="#0b7a75">partition by source_year</text>
    <text x="282" y="419" fill="#0b7a75">(see Storage → Serving ↓)</text>
  </g>
  <rect x="250" y="355" width="190" height="72" rx="6" fill="none" stroke="#0b7a75" stroke-width="1.4" stroke-dasharray="4 3"/>

  <!-- S3 <-> Step Functions -->
  <line x1="452" y1="150" x2="488" y2="150" stroke="#222" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="470" y="138" font-size="9.5" text-anchor="middle">read/</text>
  <text x="470" y="166" font-size="9.5" text-anchor="middle">write</text>

  <!-- ============ Step Functions ============ -->
  <rect x="490" y="60" width="390" height="470" rx="10" fill="#fde9ee" stroke="#d6203a" stroke-width="2"/>
  <rect x="504" y="72" width="26" height="26" rx="5" fill="#e0245e"/>
  <text x="517" y="90" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">⇄</text>
  <text x="540" y="86" font-size="15" font-weight="bold">AWS Step Functions</text>
  <text x="540" y="102" font-size="10.5" fill="#333">Orchestrates the batch workflow · retry + catch on all Lambda tasks</text>

  <!-- CheckBatch -->
  <rect x="595" y="114" width="170" height="38" rx="6" fill="#fff" stroke="#d6203a" stroke-width="1.6"/>
  <use href="#lambda" x="603" y="123"/>
  <text x="632" y="131" font-size="12" font-weight="bold">CheckBatch</text>
  <text x="632" y="145" font-size="9.5" fill="#333">cs341-check-batch</text>
  <line x1="680" y1="152" x2="680" y2="168" stroke="#222" stroke-width="1.4" marker-end="url(#arr)"/>
  <!-- diamond 1 -->
  <polygon points="680,170 775,195 680,220 585,195" fill="#fde0e0" stroke="#d6203a" stroke-width="1.6"/>
  <text x="680" y="199" font-size="11" font-weight="bold" text-anchor="middle">Already processed?</text>
  <line x1="775" y1="195" x2="798" y2="195" stroke="#222" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="784" y="188" font-size="9.5" font-weight="bold" fill="#d6203a" text-anchor="middle">YES</text>
  <rect x="800" y="181" width="66" height="28" rx="5" fill="#fff" stroke="#d6203a" stroke-width="1.4"/>
  <rect x="808" y="189" width="12" height="12" fill="#d6203a"/>
  <text x="826" y="200" font-size="11" font-weight="bold">Stop</text>
  <line x1="680" y1="220" x2="680" y2="238" stroke="#222" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="692" y="233" font-size="9.5" font-weight="bold" fill="#d6203a">NO</text>
  <!-- ValidateBatch -->
  <rect x="595" y="240" width="170" height="38" rx="6" fill="#fff" stroke="#d6203a" stroke-width="1.6"/>
  <use href="#lambda" x="603" y="249"/>
  <text x="632" y="257" font-size="12" font-weight="bold">ValidateBatch</text>
  <text x="632" y="271" font-size="9.5" fill="#333">validate_data.py</text>
  <line x1="680" y1="278" x2="680" y2="294" stroke="#222" stroke-width="1.4" marker-end="url(#arr)"/>
  <!-- diamond 2 -->
  <polygon points="680,296 750,320 680,344 610,320" fill="#fde0e0" stroke="#d6203a" stroke-width="1.6"/>
  <text x="680" y="324" font-size="11" font-weight="bold" text-anchor="middle">Valid?</text>
  <polyline points="610,320 580,320 580,368" fill="none" stroke="#222" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="590" y="312" font-size="9.5" font-weight="bold" fill="#d6203a" text-anchor="middle">FAIL</text>
  <polyline points="750,320 780,320 780,368" fill="none" stroke="#222" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="772" y="312" font-size="9.5" font-weight="bold" fill="#1e8a2e" text-anchor="middle">PASS</text>
  <!-- QuarantineBatch -->
  <rect x="505" y="370" width="150" height="38" rx="6" fill="#fff" stroke="#d6203a" stroke-width="1.6"/>
  <use href="#lambda" x="512" y="379"/>
  <text x="538" y="387" font-size="11.5" font-weight="bold">QuarantineBatch</text>
  <text x="538" y="401" font-size="9.5" fill="#333">copy to quarantine/</text>
  <line x1="580" y1="408" x2="580" y2="422" stroke="#222" stroke-width="1.4"/>
  <use href="#bucket" x="520" y="424"/>
  <text x="542" y="436" font-size="11" font-weight="bold">s3 quarantine/</text>
  <line x1="580" y1="444" x2="580" y2="462" stroke="#222" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="515" y="464" width="130" height="26" rx="5" fill="#fff" stroke="#d6203a" stroke-width="1.4"/>
  <text x="580" y="481" font-size="11" font-weight="bold" fill="#d6203a" text-anchor="middle">BatchRejected (Fail)</text>
  <!-- TransformBatch -->
  <rect x="705" y="370" width="160" height="38" rx="6" fill="#fff" stroke="#d6203a" stroke-width="1.6"/>
  <use href="#lambda" x="712" y="379"/>
  <text x="738" y="387" font-size="11.5" font-weight="bold">TransformBatch</text>
  <text x="738" y="401" font-size="9.5" fill="#333">6 scripts · pandas</text>
  <line x1="780" y1="408" x2="780" y2="422" stroke="#222" stroke-width="1.4" marker-end="url(#arr)"/>
  <!-- VerifyBatch -->
  <rect x="705" y="424" width="160" height="38" rx="6" fill="#fff" stroke="#d6203a" stroke-width="1.6"/>
  <use href="#lambda" x="712" y="433"/>
  <text x="738" y="441" font-size="11.5" font-weight="bold">VerifyBatch</text>
  <text x="738" y="455" font-size="9.5" fill="#333">row counts + reports</text>
  <line x1="780" y1="462" x2="780" y2="478" stroke="#222" stroke-width="1.4" marker-end="url(#arr)"/>
  <use href="#bucket" x="715" y="482"/>
  <text x="737" y="494" font-size="11" font-weight="bold">s3 transformation/</text>
  <text x="737" y="508" font-size="9.5" fill="#333">output · reports · _SUCCESS</text>

  <!-- catch arrows to PipelineFailed -->
  <polyline points="865,389 885,389 885,370 918,370" fill="none" stroke="#d6203a" stroke-width="1.4" marker-end="url(#arrRed)"/>
  <polyline points="865,443 893,443 893,384 918,384" fill="none" stroke="#d6203a" stroke-width="1.4" marker-end="url(#arrRed)"/>
  <text x="900" y="362" font-size="9.5" font-weight="bold" fill="#d6203a" text-anchor="middle">Catch</text>

  <!-- ============ Right column ============ -->
  <rect x="920" y="60" width="300" height="80" rx="10" fill="#f3ecfb" stroke="#7b3fc4" stroke-width="2"/>
  <rect x="934" y="74" width="26" height="26" rx="5" fill="#e0245e"/>
  <circle cx="947" cy="87" r="7" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="970" y="88" font-size="15" font-weight="bold">CloudWatch Logs</text>
  <text x="970" y="106" font-size="10.5" fill="#333">/aws/lambda/cs341-*</text>
  <text x="970" y="122" font-size="10.5" fill="#333">one log group per Lambda</text>
  <line x1="880" y1="100" x2="918" y2="100" stroke="#7b3fc4" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrPurple)"/>
  <text x="899" y="93" font-size="9.5" fill="#7b3fc4" text-anchor="middle">logs</text>

  <rect x="920" y="160" width="300" height="160" rx="10" fill="#f3ecfb" stroke="#7b3fc4" stroke-width="2"/>
  <text x="936" y="184" font-size="14" font-weight="bold">Integration results</text>
  <text x="936" y="200" font-size="10.5" fill="#333">produced by TransformBatch</text>
  <text x="936" y="224" font-size="11.5" font-weight="bold">Flood + Village Mapping</text>
  <text x="936" y="240" font-size="11" fill="#333">join on village_code · match rate 99.31%</text>
  <text x="936" y="264" font-size="11.5" font-weight="bold">Household Income + Village Mapping</text>
  <text x="936" y="280" font-size="11" fill="#333">district + subdistrict + area · unique 67.22%</text>
  <text x="936" y="304" font-size="10.5" fill="#333">ambiguous / unmatched rows kept, no forced matches</text>

  <rect x="920" y="345" width="300" height="60" rx="10" fill="#fff" stroke="#d6203a" stroke-width="2"/>
  <text x="1070" y="370" font-size="13" font-weight="bold" fill="#d6203a" text-anchor="middle">PipelineFailed (Fail)</text>
  <text x="1070" y="390" font-size="10.5" fill="#333" text-anchor="middle">Transform or Verify error after retries</text>

  <!-- ============ Storage -> Serving band ============ -->
  <rect x="20" y="560" width="1200" height="215" rx="10" fill="#e8f6f5" stroke="#0b7a75" stroke-width="2"/>
  <text x="240" y="584" font-size="15" font-weight="bold" fill="#0b7a75">Storage → Serving: Curated Zone &amp; Query</text>
  <text x="578" y="584" font-size="11" fill="#333">run after a successful batch (storage/ scripts, manual — not yet a Step Functions state)</text>

  <!-- transformation -> band connector -->
  <polyline points="780,515 780,540 125,540 125,598" fill="none" stroke="#0b7a75" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrTeal)"/>

  <g font-size="10.5" fill="#333">
    <!-- 1 -->
    <rect x="35" y="600" width="180" height="160" rx="8" fill="#fff" stroke="#3a9a3a" stroke-width="1.6"/>
    <use href="#bucket" x="45" y="610"/>
    <text x="67" y="623" font-size="12" font-weight="bold" fill="#111">transformation/output/</text>
    <text x="45" y="646">8 integrated CSV</text>
    <text x="45" y="662">flood 2566–2567 (+mapping)</text>
    <text x="45" y="678">damage 2563–2567</text>
    <text x="45" y="694">household income (+mapping)</text>
    <text x="45" y="710">village mapping</text>
    <!-- 2 -->
    <rect x="235" y="600" width="180" height="160" rx="8" fill="#fff" stroke="#f08a10" stroke-width="1.6"/>
    <text x="245" y="623" font-size="12" font-weight="bold" fill="#111">build_curated.py</text>
    <text x="245" y="646">CSV → typed Parquet</text>
    <text x="245" y="662">schema from schema.py</text>
    <text x="245" y="678">row-count + primary-key</text>
    <text x="245" y="692">checks (build report)</text>
    <text x="245" y="716" font-weight="bold" fill="#111">upload_to_s3.py</text>
    <text x="245" y="732">→ s3://…/curated/</text>
    <!-- 3 -->
    <rect x="435" y="600" width="190" height="160" rx="8" fill="#fff" stroke="#3a9a3a" stroke-width="1.6"/>
    <use href="#bucket" x="445" y="610"/>
    <text x="467" y="623" font-size="12" font-weight="bold" fill="#111">S3 curated/ (Parquet)</text>
    <text x="445" y="646">dim_village</text>
    <text x="445" y="662">fact_flood_report</text>
    <text x="457" y="676">source_year=2566, 2567</text>
    <text x="445" y="692">fact_disaster_damage</text>
    <text x="457" y="706">source_year=2563 … 2567</text>
    <text x="445" y="722">fact_household_income</text>
    <text x="445" y="744" fill="#0b7a75">star schema · partitioned</text>
    <!-- 4 -->
    <rect x="645" y="600" width="180" height="160" rx="8" fill="#fff" stroke="#7b3fc4" stroke-width="1.6"/>
    <text x="655" y="623" font-size="12" font-weight="bold" fill="#111">Glue Data Catalog</text>
    <text x="655" y="646">database flood_recovery_db</text>
    <text x="655" y="662">4 external tables</text>
    <text x="655" y="678">2 views</text>
    <text x="667" y="692">v_flood_report_village</text>
    <text x="667" y="706">v_village_profile</text>
    <text x="655" y="722">partition projection</text>
    <text x="655" y="744">DDL: sql/curated/01–02</text>
    <!-- 5 -->
    <rect x="845" y="600" width="190" height="160" rx="8" fill="#fff" stroke="#7b3fc4" stroke-width="1.6"/>
    <text x="855" y="623" font-size="12" font-weight="bold" fill="#111">Amazon Athena (SQL)</text>
    <text x="855" y="646" font-weight="bold" fill="#111">Data quality dq_01–dq_05</text>
    <text x="855" y="662">rows · PK · join coverage · gaps</text>
    <text x="855" y="684" font-weight="bold" fill="#111">Research questions</text>
    <text x="855" y="700">Q1 most-affected areas, trend</text>
    <text x="855" y="716">Q2 geography / population / income</text>
    <text x="855" y="732">Q3 aid-priority ranking</text>
    <text x="855" y="750">sql/curated/queries (7)</text>
    <!-- 6 -->
    <rect x="1055" y="600" width="150" height="160" rx="8" fill="#fff" stroke="#3b7dd8" stroke-width="1.6"/>
    <text x="1065" y="623" font-size="12" font-weight="bold" fill="#111">Results</text>
    <text x="1065" y="646">storage/query_results/</text>
    <text x="1065" y="662">(CSV per query)</text>
    <text x="1065" y="686">docs/evidence/</text>
    <text x="1065" y="702">(Athena screenshots)</text>
    <text x="1065" y="726">same SQL runs locally</text>
    <text x="1065" y="742">with DuckDB</text>
  </g>
  <g stroke="#0b7a75" stroke-width="1.6">
    <line x1="215" y1="680" x2="233" y2="680" marker-end="url(#arrTeal)"/>
    <line x1="415" y1="680" x2="433" y2="680" marker-end="url(#arrTeal)"/>
    <line x1="625" y1="680" x2="643" y2="680" marker-end="url(#arrTeal)"/>
    <line x1="825" y1="680" x2="843" y2="680" marker-end="url(#arrTeal)"/>
    <line x1="1035" y1="680" x2="1053" y2="680" marker-end="url(#arrTeal)"/>
  </g>
</svg>
